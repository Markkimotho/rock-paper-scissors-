<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Rock Paper Scissors</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%23d8432b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/main.js"></script>
</head>
<body data-state="idle">

  <header>
    <h1>rock paper scissors</h1>
    <nav>
      <button type="button" id="how" class="link">how to play</button>
      <button type="button" id="sound" class="link" aria-pressed="true">sound on</button>
    </nav>
  </header>

  <main>
    <svg class="stage" viewBox="0 0 800 430" role="img" aria-label="Two fists facing each other">
      <g class="beat" aria-hidden="true">
        <path class="ticks" d="M340 250v14M380 250v14M420 250v14M460 250v14"/>
        <circle class="dot" cx="340" cy="257" r="5"/>
      </g>
      <g class="side player" transform="translate(210 330) scale(1.55)"><g class="tilt" transform="rotate(7)"><g class="hand" id="hand-player"></g></g></g>
      <g class="side cpu" transform="translate(590 330) scale(-1.55 1.55)"><g class="tilt" transform="rotate(7)"><g class="hand" id="hand-cpu"></g></g></g>
      <path class="mark" id="mark-player" d="M170 412H250"/>
      <path class="mark" id="mark-cpu" d="M550 412H630"/>
    </svg>

    <p id="caption" class="caption" aria-live="polite"></p>

    <div class="controls" role="group" aria-label="Choose your shape">
      <button type="button" class="pick" data-move="rock">rock<kbd>r</kbd></button>
      <button type="button" class="pick" data-move="paper">paper<kbd>p</kbd></button>
      <button type="button" class="pick" data-move="scissors">scissors<kbd>s</kbd></button>
    </div>
  </main>

  <footer>
    <div class="score" id="score-player">
      <span class="who">you</span>
      <span class="n">0</span>
      <span class="pips" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
    </div>
    <button type="button" id="again" class="link" hidden>again</button>
    <div class="score right" id="score-cpu">
      <span class="who">computer</span>
      <span class="n">0</span>
      <span class="pips" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
    </div>
  </footer>

</body>
</html>
